spring.application.name=InternProject
spring.docker.compose.enabled=false
mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

app.cache.redis.enabled=false
app.cache.redis.key-prefix=intern:local
app.cache.redis.document-ttl=10m
app.cache.redis.document-ttl-jitter=2m
app.cache.redis.missing-document-ttl=1m
app.cache.redis.missing-document-ttl-jitter=15s
app.cache.redis.user-permission-ttl=5m
app.cache.redis.user-permission-ttl-jitter=1m
app.cache.redis.document-rebuild-lock-ttl=3s
app.cache.redis.document-rebuild-wait-timeout=300ms
app.cache.redis.document-rebuild-poll-interval=20ms
app.cache.redis.ticket-duplicate-window=10s
app.cache.redis.max-document-cache-bytes=524288

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
